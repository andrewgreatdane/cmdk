name: Fetch scenario assets
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and convert
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq webp >/dev/null
          mkdir -p assets
          curl -fsSL -o /tmp/eq.png "https://d8j0ntlcm91z4.cloudfront.net/user_2yFjGF4OAQW92w9YZulY16yLldT/hf_20261010_145427_8013f4e0-b1a0-42a6-8a39-2d14ee3f235d.png"
          curl -fsSL -o /tmp/grid.png "https://d8j0ntlcm91z4.cloudfront.net/user_2yFjGF4OAQW92w9YZulY16yLldT/hf_20261010_145428_fa96b3de-da7c-4c79-bc58-1c3349b19807.png"
          curl -fsSL -o /tmp/attack.png "https://d8j0ntlcm91z4.cloudfront.net/user_2yFjGF4OAQW92w9YZulY16yLldT/hf_20261010_145427_cc703aab-1c09-4f27-97bc-2fac421c5272.png"
          cwebp -q 82 -m 6 /tmp/eq.png -o assets/scenario-earthquake.webp
          cwebp -q 82 -m 6 /tmp/grid.png -o assets/scenario-grid.webp
          cwebp -q 82 -m 6 /tmp/attack.png -o assets/scenario-attack.webp
          ls -la assets
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Add scenario section images" || echo "nothing to commit"
          git push
