<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Training Modules | Resilience Systems Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;500;600&family=Geist:wght@300;400;500;600&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <style>
    main { max-width: 980px; margin: 0 auto; padding: 40px 32px 80px; }
    .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; padding-bottom: 24px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
    h1 { margin: 6px 0 0; font-family: var(--display); font-weight: 500; font-size: clamp(36px, 5vw, 56px); line-height: .95; text-transform: uppercase; }
    h1 .outline { color: transparent; -webkit-text-stroke: 1px var(--paper); }
    .intro { color: var(--muted); font-size: 13px; max-width: 60ch; margin: 12px 0 0; }
    .ml { list-style: none; margin: 0; padding: 0; }
    .mi { display: grid; grid-template-columns: auto 44px 1fr auto; gap: 14px; align-items: start; padding: 20px 0; border-bottom: 1px solid var(--line); }
    .mi .drag { padding-top: 4px; }
    .mi .idx { font-family: var(--display); font-size: 26px; line-height: 1; color: var(--dim); }
    .mi h2 { margin: 0; font-size: 15px; font-weight: 500; }
    .mi p { margin: 4px 0 0; color: var(--muted); font-size: 13px; max-width: 70ch; }
    .mi .lk { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 12px; }
    .mi .lk a { color: #b2b7bb; text-decoration: underline; text-underline-offset: 3px; }
    .mi .lk a:hover { color: #fff; }
    .mi .side { text-align: right; display: grid; gap: 8px; justify-items: end; }
    .mi .meta { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .empty { padding: 48px 0; text-align: center; color: var(--muted); }
    .links-help { font-size: 11px; color: var(--dim); }
    @media (max-width: 640px) { main { padding: 24px 16px 60px; } .mi { grid-template-columns: auto 1fr; } .mi .idx { display: none; } .mi .side { grid-column: 2; justify-items: start; text-align: left; } }
  </style>
</head>
<body>
  <main>
    <div class="top">
      <div><span class="eyebrow">Library</span><h1>Training <span class="outline">Modules</span></h1>
        <p class="intro">The master list of modules. Each customer gets their own sequence, set on their page. Drag here to set the default library order.</p></div>
      <button class="btn btn-solid" id="add" type="button" style="gap:32px">New module <span aria-hidden="true">+</span></button>
    </div>
    <ul class="ml" id="list"></ul>
  </main>

  <dialog class="adm-dialog" id="dlg">
    <form method="dialog" id="form">
      <div class="dlg-head"><h2 id="dlg-t">Module</h2><button class="adm-link" value="cancel" formnovalidate>Close</button></div>
      <div class="dlg-body">
        <label class="field"><span class="lbl">Title</span><input name="title" required></label>
        <label class="field"><span class="lbl">Description</span><textarea name="description"></textarea></label>
        <label class="field" style="max-width:180px"><span class="lbl">Duration (minutes)</span><input name="duration_min" type="number" min="0" step="5"></label>
        <label class="field"><span class="lbl">Videos &amp; links</span><textarea name="links" placeholder="RTO Basics | https://www.youtube.com/watch?v=…&#10;Checklist PDF | https://…"></textarea><span class="links-help">One per line: label | URL. YouTube, Vimeo, PDFs, Google Docs all work.</span></label>
      </div>
      <div class="dlg-foot"><button class="btn btn-danger" type="button" id="del">Delete module</button><span class="spacer"></span><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn btn-solid" value="save">Save</button></div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
  <script src="config.js"></script>
  <script src="seed.js"></script>
  <script src="core.js"></script>
  <script>
  (async function () {
    const { store, esc, toast } = RS;
    const user = await RS.auth.guard();
    RS.header('training.html', user);
    if (await RS.ensureSeed()) toast('Starter catalog loaded');
    let modules = (await store.list('modules')).sort((a, b) => a.sort - b.sort);
    let usage = await store.list('customer_modules');
    const $ = s => document.querySelector(s);

    function render() {
      const host = $('#list');
      host.innerHTML = modules.length ? modules.map((m, i) => {
        const n = usage.filter(u => u.module_id === m.id).length;
        const links = (m.links || []).filter(l => l && l.url).map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label || 'Link')} ↗</a>`).join('');
        return `<li class="mi" data-id="${m.id}"><span class="drag" title="Drag to reorder" aria-hidden="true">⋮⋮</span><span class="idx">${String(i + 1).padStart(2, '0')}</span>
          <div><h2>${esc(m.title)}</h2>${m.description ? `<p>${esc(m.description)}</p>` : ''}${links ? `<div class="lk">${links}</div>` : ''}</div>
          <div class="side"><span class="meta">${m.duration_min ? m.duration_min + ' min · ' : ''}${n} customer${n === 1 ? '' : 's'}</span><button class="btn btn-sm" type="button" data-edit>Edit</button></div></li>`;
      }).join('') : '<li class="empty">No modules yet.</li>';
      Sortable.create(host, { handle: '.drag', animation: 150, onEnd: async () => {
        const ids = [...host.querySelectorAll('[data-id]')].map(li => li.dataset.id);
        for (let i = 0; i < ids.length; i++) { const m = modules.find(x => x.id === ids[i]); if (m.sort !== i) { m.sort = i; await store.update('modules', m.id, { sort: i }); } }
        modules.sort((a, b) => a.sort - b.sort); render();
      } });
    }

    const dlg = $('#dlg'), form = $('#form'); let editing = null;
    function open(m) {
      editing = m || null; form.reset();
      $('#dlg-t').textContent = m ? 'Edit module' : 'New module'; $('#del').hidden = !m;
      if (m) {
        form.elements.title.value = m.title; form.elements.description.value = m.description || ''; form.elements.duration_min.value = m.duration_min || '';
        form.elements.links.value = (m.links || []).map(l => (l.label ? l.label + ' | ' : '') + l.url).join('\n');
      }
      dlg.showModal(); form.elements.title.focus();
    }
    function parseLinks(txt) {
      return txt.split('\n').map(s => s.trim()).filter(Boolean).map(line => {
        const p = line.split('|'); const url = p.pop().trim(); const label = p.join('|').trim();
        return { label: label || url.replace(/^https?:\/\/(www\.)?/, '').split('/')[0], url };
      }).filter(l => /^https?:\/\//i.test(l.url));
    }
    $('#add').addEventListener('click', () => open(null));
    $('#list').addEventListener('click', e => { const b = e.target.closest('[data-edit]'); if (b) open(modules.find(m => m.id === b.closest('[data-id]').dataset.id)); });
    dlg.addEventListener('close', async () => {
      if (dlg.returnValue !== 'save') return;
      const data = { title: form.elements.title.value.trim(), description: form.elements.description.value.trim() || null, duration_min: form.elements.duration_min.value ? parseInt(form.elements.duration_min.value) : null, links: parseLinks(form.elements.links.value) };
      if (!data.title) return;
      if (editing) { Object.assign(editing, await store.update('modules', editing.id, data)); toast('Saved'); }
      else { data.sort = modules.length; modules.push(await store.insert('modules', data)); toast('Module added'); }
      render();
    });
    $('#del').addEventListener('click', async () => {
      if (!editing) return;
      const n = usage.filter(u => u.module_id === editing.id).length;
      if (!confirm(`Delete "${editing.title}"?${n ? ` It will be removed from ${n} customer path${n === 1 ? '' : 's'}.` : ''}`)) return;
      await store.remove('modules', editing.id);
      modules = modules.filter(m => m.id !== editing.id); usage = usage.filter(u => u.module_id !== editing.id);
      dlg.close('cancel'); toast('Deleted'); render();
    });
    render();
  })();
  </script>
</body>
</html>
