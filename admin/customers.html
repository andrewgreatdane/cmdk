<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Customers | Resilience Systems Admin</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="admin.css">
  <style>
    .wrap { display: grid; grid-template-columns: 240px 1fr; }
    /* customer list */
    .clients { border-right: 1px solid var(--rule-soft); padding: 24px 0; position: sticky; top: 112px; height: calc(100vh - 112px); overflow: auto; }
    .clients-head { padding: 0 20px 14px; display: grid; gap: 10px; }
    .clist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
    .clist button { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule-soft); padding: 10px 20px; cursor: pointer; display: grid; gap: 1px; }
    .clist button:hover { background: var(--hover); }
    .clist button[aria-current] { background: var(--sel); }
    .clist button[aria-current] .nm { font-weight: 600; }
    .clist .nm { font-size: 14px; font-weight: 500; }
    .clist .mt { font-size: 12px; color: var(--ink-3); display: flex; justify-content: space-between; gap: 8px; }
    .clist .empty { padding: 16px 20px; color: var(--ink-3); font-size: 13px; }

    /* workspace */
    .work { padding: 24px 32px 80px; min-width: 0; max-width: 1200px; }
    .blank { padding: 80px 0; color: var(--ink-3); }
    .c-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
    .c-head h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -.01em; }
    .c-meta { font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 4px; }
    .c-meta span:empty { display: none; }
    .c-notes.ref { color: var(--ink-2); }
    .c-notes.ref a { color: var(--ink); }
    .c-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .c-notes { margin: 6px 0 0; font-size: 13px; color: var(--ink-3); max-width: 70ch; white-space: pre-wrap; }

    /* totals live in the top bar, like the gear page */
    .adm-slot { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
    .adm-slot .amt { font-family: var(--mono); font-size: 30px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .adm-slot .cnt { font-family: var(--mono); font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
    .adm-slot .over { color: #a3271b; }

    .cols { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 32px; align-items: start; margin-bottom: 48px; }
    .side { position: sticky; top: 128px; }
    .colhead { display: flex; min-width: 0; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 4px; }
    .colhead .inp { max-width: 200px; font-size: 13px; padding: 4px 8px; }
    .hint { font-size: 12px; color: var(--ink-3); margin: 6px 0 0; }

    /* catalog (gear-page rows) */
    .cat { margin-top: 18px; }
    .cat > summary { list-style: none; cursor: pointer; user-select: none; }
    .cat > summary::-webkit-details-marker { display: none; }
    .cat > summary .h2::before { content: "+"; font-family: var(--mono); font-size: 14px; width: 1em; flex: none; }
    .cat[open] > summary .h2::before { content: "\2013"; }
    .cat > summary .h2 .t { flex: 1; }
    .cat > summary:hover .t { text-decoration: underline; text-underline-offset: 3px; }
    .cat:not([open]) > summary .h2 { border-bottom-color: var(--rule-soft); }
    .gl { list-style: none; margin: 0; padding: 0; }
    .gi { display: grid; grid-template-columns: 20px 44px 1fr auto; gap: 10px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--rule-soft); cursor: pointer; user-select: none; }
    .gi:hover { background: var(--hover); }
    .gi .box { width: 16px; height: 16px; border: 1px solid var(--ink); display: grid; place-items: center; font-size: 11px; line-height: 1; color: #fff; background: #fff; }
    .gi.on { background: var(--sel); }
    .gi.on .box { background: #000; }
    .gi.on .box::after { content: '✓'; }
    .gi.on .nm { font-weight: 600; }
    .th { width: 44px; height: 44px; display: block; object-fit: contain; background: #fff; border: 1px solid var(--rule-soft); }
    .th.none { border-style: dashed; }
    .gi .nm { font-size: 14px; line-height: 1.3; font-weight: 500; }
    .gi .sub { font-size: 12px; color: var(--ink-3); }
    .gi .pr { font-family: var(--mono); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* capability bands: catalog left, package right */
    .band { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); column-gap: 32px; align-items: start; }
    .bandhead { margin-bottom: 4px; }
    #bands .band { margin-top: 22px; }
    .bh { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--rule); text-align: left; cursor: pointer; font-family: inherit; color: var(--ink); }
    .bh.right { cursor: default; }
    .bh .t { flex: 1; }
    button.bh::before { content: "\2013"; font-family: var(--mono); font-size: 14px; width: 1em; flex: none; }
    .band.closed button.bh::before { content: "+"; }
    button.bh:hover .t { text-decoration: underline; text-underline-offset: 3px; }
    .band.closed .gl, .band.closed .pk { display: none; }
    .band.closed .bh { border-bottom-color: var(--rule-soft); }
    .band.none-in .bh.right .t { color: var(--ink-3); }
    .band .pk { min-height: 0; }
    /* package */
    .pk { list-style: none; margin: 0; padding: 0; min-height: 60px; }
    .pk-none { padding: 6px 0 8px; color: var(--ink-3); font-size: 13px; border-bottom: 1px solid var(--rule-soft); }
    .pk-cat.empty { color: #b3b3b3; }
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--rule); margin: 0 0 24px; overflow-x: auto; }
    .tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 16px 8px 0; margin-right: 16px; cursor: pointer; font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
    .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
    .tabs button:hover { color: var(--ink); }
    .mem { list-style: none; margin: 0; padding: 0; }
    .mem li { padding: 10px 0; border-bottom: 1px solid var(--rule-soft); cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
    .mem li:hover { background: var(--hover); }
    .mem .nm { font-weight: 600; font-size: 14px; }
    .mem .sub { font-size: 13px; color: var(--ink-2); grid-column: 1 / -1; }
    .mem .flag { font-family: var(--mono); font-size: 12px; color: #a3271b; grid-column: 1 / -1; }
    .mem .age { font-family: var(--mono); font-size: 13px; color: var(--ink-3); }
    .mem .empty { color: var(--ink-3); font-size: 13px; cursor: default; display: block; }
    .facts { display: grid; grid-template-columns: 140px 1fr; margin: 0; }
    .facts dt, .facts dd { padding: 8px 0; border-bottom: 1px solid var(--rule-soft); margin: 0; font-size: 14px; }
    .facts dt { color: var(--ink-3); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding-top: 10px; }
    .facts dd { white-space: pre-wrap; }
    .muted { color: var(--ink-3); }
    .tk { list-style: none; margin: 0; padding: 0; }
    .tk li { display: grid; grid-template-columns: 20px 96px 1fr auto; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--rule-soft); font-size: 14px; }
    .tk li.done { color: var(--ink-3); text-decoration: line-through; }
    .tk .d { font-family: var(--mono); font-size: 13px; }
    .tk .late .d, .tk li.late .d { color: #a3271b; }
    .tk .who { font-size: 12px; color: var(--ink-3); }
    .tk input { accent-color: #000; }
    .taskform { display: grid; gap: 10px; padding-top: 10px; }
    .taskform .btn { justify-self: start; }
    .msec { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 6px 0 -4px; }
    .pi { display: grid; grid-template-columns: minmax(0,1fr) auto auto auto auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--rule-soft); }
    .pi .nm { font-size: 14px; line-height: 1.3; }
    .qty { display: inline-flex; border: 1px solid var(--rule-soft); }
    .qty button { width: 22px; background: none; border: 0; cursor: pointer; color: var(--ink-3); font-family: var(--mono); }
    .qty button:hover { color: var(--ink); }
    .qty input { width: 30px; text-align: center; background: none; border: 0; border-inline: 1px solid var(--rule-soft); padding: 2px 0; font-family: var(--mono); font-size: 13px; -moz-appearance: textfield; }
    .qty input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .unit { width: 80px; border: 1px solid var(--rule-soft); padding: 2px 6px; font-family: var(--mono); font-size: 13px; text-align: right; background: #fff; }
    .unit:focus { outline: none; border-color: var(--ink); }
    .unit.custom { border-color: var(--ink); }
    .line { text-align: right; font-family: var(--mono); font-size: 13px; min-width: 80px; font-variant-numeric: tabular-nums; }
    .x { background: none; border: 0; color: var(--ink-3); cursor: pointer; font-size: 16px; padding: 0 0 0 2px; line-height: 1; }
    .x:hover { color: #a3271b; }
    .pk.drop-hover { background: var(--sel); }
    .pk-cat { display: flex; justify-content: space-between; gap: 10px; padding: 14px 0 4px; border-bottom: 1px solid var(--rule-soft); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
    .pk-cat span:last-child { font-family: var(--mono); letter-spacing: 0; }
    .pk-cat:first-child { padding-top: 8px; }

    /* training */
    .tl { list-style: none; margin: 0; padding: 0; min-height: 50px; }
    .ti { display: grid; grid-template-columns: auto 28px 1fr auto; gap: 10px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--rule-soft); background: #fff; }
    .ti .idx { font-family: var(--mono); font-size: 13px; color: var(--ink-3); padding-top: 1px; }
    .ti .nm { font-size: 14px; font-weight: 500; }
    .ti .ds { font-size: 13px; color: var(--ink-2); }
    .ti .lk { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 2px; font-size: 12px; }
    .ti .lk a { color: var(--ink-3); }
    .ti .dur { font-family: var(--mono); font-size: 12px; color: var(--ink-3); white-space: nowrap; }
    .lib .ti { grid-template-columns: 1fr auto; cursor: grab; }
    .addm { background: none; border: 1px solid var(--ink); width: 24px; height: 24px; cursor: pointer; font-size: 15px; line-height: 1; padding: 0; }
    .addm:hover { background: #000; color: #fff; }
    .tl-empty { padding: 16px 0; color: var(--ink-3); font-size: 13px; }

    @media (max-width: 900px) {
      .wrap { grid-template-columns: 1fr; }
      .clients { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule-soft); max-height: 280px; padding-top: 16px; }
      .cols { grid-template-columns: 1fr; }
      .side { position: static; }
      .band { grid-template-columns: 1fr; }
      .bh.right { margin-top: 10px; }
      .bandhead .colhead:last-child { display: none; }
      .work { padding: 20px 16px 60px; }
      .adm-slot .amt { font-size: 24px; }
    }
    @media (max-width: 520px) { .pi { grid-template-columns: minmax(0,1fr) auto auto auto; } .pi .unit { display: none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <aside class="clients" aria-label="Customers">
      <div class="clients-head">
        <input class="inp" id="csearch" type="search" placeholder="Search customers" aria-label="Search customers">
        <button class="btn btn-solid" id="new-customer" type="button">+ New customer</button>
        <button class="adm-link" id="blank-intake" type="button" style="justify-self:start">Copy blank intake form link</button>
      </div>
      <ul class="clist" id="clist"></ul>
    </aside>

    <main class="work" id="work">
      <p class="blank">Select a customer, or add a new one.</p>
    </main>
  </div>

  <dialog class="adm-dialog" id="cdlg">
    <form method="dialog" id="cform">
      <div class="dlg-head"><h2 id="cdlg-title">Customer</h2><button class="adm-link" value="cancel" formnovalidate>Close</button></div>
      <div class="dlg-body">
        <label class="field"><span class="lbl">Name</span><input name="name" required></label>
        <div class="grid2">
          <label class="field"><span class="lbl">Email</span><input name="email" type="email"></label>
          <label class="field"><span class="lbl">Phone</span><input name="phone"></label>
        </div>
        <div class="grid2">
          <label class="field"><span class="lbl">Household</span><input name="household" placeholder="e.g. 2 adults, 2 children, 1 dog"></label>
          <label class="field"><span class="lbl">Location</span><input name="location"></label>
        </div>
        <div class="grid2">
          <label class="field"><span class="lbl">Status</span>
            <select name="status"><option>Intake</option><option>Assessment</option><option>Design</option><option>Proposal</option><option>Active</option><option>Delivered</option><option>Paused</option></select>
          </label>
          <label class="field"><span class="lbl">Referred by</span><select name="referred_by"><option value="">No one</option></select></label>
        </div>
        <label class="field"><span class="lbl">Address (used for the map)</span><input name="address" placeholder="Street, city, province"></label>
        <label class="field"><span class="lbl">Home</span><input name="home" placeholder="e.g. 3-storey house, basement, generator hookup"></label>
        <div class="grid2">
          <label class="field"><span class="lbl">Vehicles</span><input name="vehicles"></label>
          <label class="field"><span class="lbl">Pets</span><input name="pets"></label>
        </div>
        <label class="field"><span class="lbl">Emergency contacts</span><textarea name="emergency_contacts" placeholder="Name, relation, phone — one per line"></textarea></label>
        <label class="field"><span class="lbl">Notes</span><textarea name="notes"></textarea></label>
      </div>
      <div class="dlg-foot"><button class="btn btn-danger" type="button" id="cdelete">Delete customer</button><span class="spacer"></span><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn btn-solid" value="save">Save</button></div>
    </form>
  </dialog>

  <dialog class="adm-dialog" id="mdlg">
    <form method="dialog" id="mform">
      <div class="dlg-head"><h2 id="mdlg-title">Person</h2><button class="adm-link" value="cancel" formnovalidate>Close</button></div>
      <div class="dlg-body">
        <div class="grid2">
          <label class="field"><span class="lbl">Name</span><input name="name" required></label>
          <label class="field"><span class="lbl">Relationship</span><input name="relationship" placeholder="e.g. Spouse, Son, Mother"></label>
        </div>
        <div class="grid2">
          <label class="field"><span class="lbl">Birth year</span><input name="birth_year" type="number" min="1900" max="2100" placeholder="e.g. 1984"></label>
          <label class="field"><span class="lbl">Sex</span><select name="sex"><option value=""></option><option>Female</option><option>Male</option><option>Other</option></select></label>
        </div>
        <div class="grid2">
          <label class="field"><span class="lbl">Height</span><input name="height" placeholder="e.g. 5'10&quot; / 178 cm"></label>
          <label class="field"><span class="lbl">Weight</span><input name="weight" placeholder="e.g. 170 lb"></label>
        </div>
        <p class="msec">Sizes</p>
        <div class="grid2">
          <label class="field"><span class="lbl">Top / jacket</span><input name="size_top"></label>
          <label class="field"><span class="lbl">Pants (waist × inseam)</span><input name="size_bottom"></label>
        </div>
        <div class="grid2">
          <label class="field"><span class="lbl">Shoe</span><input name="size_shoe"></label>
          <label class="field"><span class="lbl">Gloves / hat</span><input name="size_other"></label>
        </div>
        <p class="msec">Health</p>
        <div class="grid2">
          <label class="field"><span class="lbl">Blood type</span><input name="blood_type"></label>
          <label class="field"><span class="lbl">Allergies</span><input name="allergies"></label>
        </div>
        <label class="field"><span class="lbl">Medical conditions</span><textarea name="medical"></textarea></label>
        <label class="field"><span class="lbl">Medications &amp; supply needed</span><textarea name="medications" placeholder="Name, dose, how many days on hand"></textarea></label>
        <div class="grid2">
          <label class="field"><span class="lbl">Diet</span><input name="diet" placeholder="e.g. gluten-free, infant formula"></label>
          <label class="field"><span class="lbl">Mobility / special needs</span><input name="mobility" placeholder="e.g. glasses, hearing aid, wheelchair"></label>
        </div>
        <label class="field"><span class="lbl">Skills &amp; other notes</span><textarea name="notes" placeholder="e.g. nurse, ham licence, fear of water"></textarea></label>
      </div>
      <div class="dlg-foot"><button class="btn btn-danger" type="button" id="mdelete">Remove person</button><span class="spacer"></span><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn btn-solid" value="save">Save</button></div>
    </form>
  </dialog>

  <dialog class="adm-dialog" id="pwdlg">
    <form method="dialog" id="pwform">
      <div class="dlg-head"><h2>Set password</h2><button class="adm-link" value="cancel" formnovalidate>Close</button></div>
      <div class="dlg-body"><label class="field"><span class="lbl">New password (8+ characters)</span><input name="pw" type="password" minlength="8" autocomplete="new-password" required></label></div>
      <div class="dlg-foot"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn btn-solid" value="save">Save password</button></div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
  <script src="config.js"></script>
  <script src="seed.js"></script>
  <script src="core.js"></script>
  <script>
  (async function () {
    const { store, money, esc, toast } = RS;
    const user = await RS.auth.guard();
    RS.header('customers.html', user);
    if (RS.live) { // let invited admins set a password after using an email link
      const b = document.createElement('button'); b.className = 'adm-link'; b.type = 'button'; b.textContent = 'Set password';
      document.querySelector('.adm-user').insertBefore(b, document.getElementById('adm-signout'));
      b.addEventListener('click', () => { document.getElementById('pwform').reset(); document.getElementById('pwdlg').showModal(); });
      document.getElementById('pwdlg').addEventListener('close', async e => {
        if (e.target.returnValue !== 'save') return;
        try { await RS.auth.setPassword(document.querySelector('#pwform [name=pw]').value); toast('Password saved'); } catch (x) { toast(x.message, true); }
      });
    }
    if (await RS.ensureSeed()) toast('Starter catalog loaded');

    let S, cats, gear, customers, cg, cm, modules, members, tasks;
    let tab = (() => { try { return localStorage.getItem('rs-ctab') || 'gear'; } catch (e) { return 'gear'; } })();
    const params = new URLSearchParams(location.search);
    let currentId = params.get('id');
    let openCats = null;   // remembers collapsed catalog sections
    let catQuery = '';

    async function load() {
      [S, cats, gear, customers, cg, cm, modules, members, tasks] = await Promise.all([
        RS.settings(), store.list('categories'), store.list('gear'), store.list('customers'),
        store.list('customer_gear'), store.list('customer_modules'), store.list('modules'),
        store.list('members').catch(() => []), store.list('tasks').catch(() => [])]);
      cats.sort((a, b) => a.sort - b.sort);
      gear.sort((a, b) => a.sort - b.sort);
      modules.sort((a, b) => a.sort - b.sort);
      customers.sort((a, b) => a.name.localeCompare(b.name));
    }
    const gearById = id => gear.find(g => g.id === id);
    const catName = id => (cats.find(c => c.id === id) || {}).name || 'Unsorted';

    /* ---------- referrals: one free membership year per referred customer who signs on ---------- */
    const SIGNED = ['Active', 'Delivered'];
    function referrals(c) {
      const all = customers.filter(x => x.referred_by === c.id);
      const earned = all.filter(x => SIGNED.includes(x.status));
      return { all, earned, pending: all.filter(x => !SIGNED.includes(x.status)) };
    }
    /* ---------- client list ---------- */
    function renderList() {
      const q = document.getElementById('csearch').value.trim().toLowerCase();
      const rows = customers.filter(c => !q || [c.name, c.email, c.location, c.status].join(' ').toLowerCase().includes(q));
            document.getElementById('clist').innerHTML = rows.length ? rows.map(c => {
        const n = cg.filter(x => x.customer_id === c.id).reduce((s, x) => s + x.qty, 0);
        return `<li><button type="button" data-id="${c.id}" ${c.id === currentId ? 'aria-current="true"' : ''}><span class="nm">${esc(c.name)}</span><span class="mt">${esc(c.status || 'Intake')} · ${n} item${n === 1 ? '' : 's'}${c.intake_submitted_at ? ' · intake in' : ''}${referrals(c).earned.length ? ` · ${referrals(c).earned.length} free yr${referrals(c).earned.length === 1 ? '' : 's'}` : ''}</span></button></li>`;
      }).join('') : `<li class="empty">${customers.length ? 'No match.' : 'No customers yet.'}</li>`;
    }
    document.getElementById('csearch').addEventListener('input', renderList);
    document.getElementById('blank-intake').addEventListener('click', async () => {
      const url = location.origin + '/intake.html';
      try { await navigator.clipboard.writeText(url); toast('Blank intake link copied. New submissions appear here as customers.'); } catch (e) { prompt('Copy this link:', url); }
    });
    document.getElementById('clist').addEventListener('click', e => {
      const b = e.target.closest('button[data-id]'); if (!b) return;
      select(b.dataset.id);
    });
    function select(id) {
      currentId = id;
      history.replaceState(null, '', id ? '?id=' + id : location.pathname);
      renderList(); renderWork();
      if (window.innerWidth < 900) document.getElementById('work').scrollIntoView({ behavior: 'smooth' });
    }

    /* ---------- totals ---------- */
    function totals(c) {
      const lines = cg.filter(x => x.customer_id === c.id);
      let cost = 0, sell = 0, vol = 0, cap = 0, units = 0, est = false;
      for (const l of lines) {
        const g = gearById(l.gear_id); if (!g) continue;
        units += l.qty;
        cost += money.costCAD(g, S) * l.qty;
        sell += money.sellCAD(g, S, l.sell_cad) * l.qty;
        if (g.capacity_l) cap += Number(g.capacity_l) * l.qty;
        if (g.volume_l) vol += Number(g.volume_l) * l.qty;
        if (g.volume_est || g.price_est) est = true;
      }
      return { lines: lines.length, units, cost, sell, vol, cap, est };
    }
    function renderTotals(c) {
      const el = document.getElementById('adm-slot'); if (!el) return;
      if (!c) { el.innerHTML = ''; return; }
      const t = totals(c), m = t.sell - t.cost, pct = t.sell ? (m / t.sell) * 100 : 0;
      const vol = t.cap ? `<span class="${t.vol > t.cap ? 'over' : ''}">${t.est ? '≈' : ''}${t.vol.toFixed(1)} / ${t.cap.toFixed(1)} L</span>` : `${t.est ? '≈' : ''}${t.vol.toFixed(1)} L`;
      el.innerHTML = `<span class="lbl">Package</span><span class="amt">${money.cad(t.sell)}</span>
        <span class="cnt">${t.units} item${t.units === 1 ? '' : 's'} · ${vol} · cost ${money.cad(t.cost)} · margin ${money.cad(m)} (${pct.toFixed(0)}%) · ${money.cad(t.sell / S.rate)} USD</span>`;
    }

    function refLine(c) {
      const r = referrals(c), by = customers.find(x => x.id === c.referred_by);
      const link = x => `<a href="?id=${x.id}" data-goto="${x.id}">${esc(x.name)}</a>`;
      const parts = [];
      if (by) parts.push(`Referred by ${link(by)}`);
      if (r.all.length) parts.push(`<b>${r.earned.length} free membership year${r.earned.length === 1 ? '' : 's'} earned</b> — referred ${r.all.map(x => link(x) + (SIGNED.includes(x.status) ? '' : ' <span class="muted">(pending)</span>')).join(', ')}`);
      return parts.length ? `<p class="c-notes ref">${parts.join(' · ')}</p>` : '';
    }
    document.addEventListener('click', e => { const a = e.target.closest('a[data-goto]'); if (!a) return; e.preventDefault(); select(a.dataset.goto); });

    /* ---------- workspace ---------- */
    function renderWork() {
      const w = document.getElementById('work');
      const c = customers.find(x => x.id === currentId);
      if (!c) { w.innerHTML = `<p class="blank">Select a customer, or add a new one.</p>`; renderTotals(null); return; }
      const nextTask = tasks.filter(t => t.customer_id === c.id && !t.done_at).sort((x, y) => x.due_date.localeCompare(y.due_date))[0];
      const nMem = members.filter(m => m.customer_id === c.id).length;
      w.innerHTML = `
        <div class="c-head">
          <div>
            <h1>${esc(c.name)}</h1>
            <div class="c-meta"><span>${esc(c.status || 'Intake')}</span><span>${esc(c.location || '')}</span><span>${esc(c.email || '')}</span><span>${esc(c.phone || '')}</span></div>
            ${refLine(c)}
            ${c.intake_submitted_at ? `<p class="c-notes">Intake received ${RS.fmtDate(c.intake_submitted_at.slice(0, 10))}</p>` : ''}
            ${nextTask ? `<p class="c-notes">Next: ${esc(nextTask.kind)}${nextTask.title ? ' — ' + esc(nextTask.title) : ''} · ${RS.fmtDate(nextTask.due_date)}</p>` : ''}
          </div>
          <div class="c-actions"><button class="btn" type="button" id="intake-link" title="Copy a private link the client can use to fill in their own details">Copy intake link</button><button class="btn" type="button" id="edit-c">Edit details</button></div>
        </div>
        <nav class="tabs" role="tablist">
          ${[['onboarding', `Onboarding${nMem ? ' (' + nMem + ')' : ''}`], ['gear', 'Gear'], ['training', 'Training'], ['schedule', 'Schedule']].map(([k, l]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${tab === k}">${l}</button>`).join('')}
        </nav>

        <section data-pane="onboarding" ${tab === 'onboarding' ? '' : 'hidden'}>
          <div class="cols">
            <div>
              <h2 class="h2"><span>Household members</span><button type="button" class="adm-link" id="add-member">+ Add person</button></h2>
              <ul class="mem" id="members"></ul>
            </div>
            <div>
              <h2 class="h2"><span>Home &amp; logistics</span><button type="button" class="adm-link" id="edit-c2">Edit</button></h2>
              <dl class="facts">
                ${[['Address', c.address], ['Household', c.household], ['Home', c.home], ['Vehicles', c.vehicles], ['Pets', c.pets], ['Emergency contacts', c.emergency_contacts],
                  ...(c.intake ? [['Concerns', (c.intake.concerns || []).join(', ')], ['Timeline', c.intake.timeline], ['Other locations', c.intake.other_locations], ['Contact by', c.intake.contact_pref], ['Heard about us', c.intake.referral], ['Client notes', c.intake.notes]] : []),
                  ['Our notes', c.notes]].map(([k, v]) => `<dt>${k}</dt><dd>${v ? esc(v) : '<span class="muted">—</span>'}</dd>`).join('')}
              </dl>
            </div>
          </div>
        </section>

        <section data-pane="gear" ${tab === 'gear' ? '' : 'hidden'}>
          <div class="band bandhead">
            <div class="colhead"><span class="lbl">Catalog — click to add or remove</span><input class="inp" type="search" id="gsearch" placeholder="Filter gear" aria-label="Filter gear" value="${esc(catQuery)}"></div>
            <div class="colhead"><span class="lbl">Their package</span><span class="lbl" id="pk-count"></span></div>
          </div>
          <div id="bands"></div>
          <p class="hint">Price box = client price per unit. Leave blank to use the catalog price.</p>
        </section>

        <section data-pane="training" ${tab === 'training' ? '' : 'hidden'}>
          <div class="cols">
            <div><h2 class="h2"><span>Training path</span><span class="sub" id="tl-count"></span></h2><ol class="tl" id="tpath"></ol><p class="hint">Drag ⋮⋮ to set the order.</p></div>
            <div class="lib"><h2 class="h2"><span>Module library</span><a class="sub" href="training.html">manage</a></h2><ul class="tl" id="tlib"></ul></div>
          </div>
        </section>

        <section data-pane="schedule" ${tab === 'schedule' ? '' : 'hidden'}>
          <div class="cols">
            <div><h2 class="h2"><span>Their schedule</span><a class="sub" href="schedule.html">all customers</a></h2><ul class="tk" id="ctasks"></ul></div>
            <div>
              <h2 class="h2"><span>Add to schedule</span></h2>
              <form id="taskform" class="taskform">
                <label class="field"><span class="lbl">What</span><select name="kind">${RS.TASK_KINDS.map(k => `<option>${k}</option>`).join('')}</select></label>
                <label class="field"><span class="lbl">Details (optional)</span><input name="title" placeholder="e.g. Swap batteries, top up water"></label>
                <div class="grid2"><label class="field"><span class="lbl">Due</span><input name="due_date" type="date" required></label>
                <label class="field"><span class="lbl">Who</span><select name="assignee"><option value="">Anyone</option>${RS.ADMIN_NAMES.map(n => `<option>${esc(n)}</option>`).join('')}</select></label></div>
                <button class="btn btn-solid" type="submit">Add</button>
              </form>
            </div>
          </div>
        </section>`;
      document.querySelectorAll('.tabs [data-tab]').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; try { localStorage.setItem('rs-ctab', tab); } catch (e) {} renderWork(); }));
      document.getElementById('edit-c2').addEventListener('click', () => openCustomer(c));
      document.getElementById('intake-link').addEventListener('click', async () => {
        if (!c.intake_token) { const tok = RS.uid(); try { Object.assign(c, await store.update('customers', c.id, { intake_token: tok })); } catch (e) { return; } }
        const url = location.origin + '/intake.html?t=' + c.intake_token;
        try { await navigator.clipboard.writeText(url); toast('Intake link copied. Send it to the client.'); }
        catch (e) { prompt('Copy this link and send it to the client:', url); }
      });
      document.getElementById('add-member').addEventListener('click', () => openMember(c, null));
      document.getElementById('taskform').addEventListener('submit', async e => {
        e.preventDefault(); const f = e.target.elements;
        const r = await store.insert('tasks', { customer_id: c.id, kind: f.kind.value, title: f.title.value.trim() || null, due_date: f.due_date.value, assignee: f.assignee.value || null, done_at: null });
        tasks.push(r);
        if (r.kind === 'Delivery') { const d = new Date(r.due_date + 'T12:00:00'); d.setFullYear(d.getFullYear() + 1); tasks.push(await store.insert('tasks', { customer_id: c.id, kind: 'Annual check', title: null, due_date: d.toISOString().slice(0, 10), assignee: r.assignee, done_at: null })); toast('Delivery added, first annual check booked a year later'); }
        else toast('Added to schedule');
        renderWork();
      });
      document.getElementById('edit-c').addEventListener('click', () => openCustomer(c));
      const gs = document.getElementById('gsearch');
      gs.addEventListener('input', () => { catQuery = gs.value; renderCatalog(c); });
      renderTotals(c); renderCatalog(c); renderPackage(c); renderTraining(c); renderMembers(c); renderTasks(c);
    }

    function inPkg(c, gid) { return cg.find(x => x.customer_id === c.id && x.gear_id === gid); }

    // One band per capability: catalog on the left, their picks on the right, headers level.
    function renderCatalog(c) {
      const host = document.getElementById('bands'); if (!host) return;
      const q = catQuery.trim().toLowerCase();
      const keyOf = g => cats.some(k => k.id === g.category_id) ? g.category_id : 'none';
      const lines = cg.filter(x => x.customer_id === c.id && gearById(x.gear_id));
      document.getElementById('pk-count').textContent = lines.length ? `${lines.length} line${lines.length === 1 ? '' : 's'}` : '';
      const groups = [...cats, { id: 'none', name: 'Unsorted' }];
      host.innerHTML = groups.map(cat => {
        const all = gear.filter(g => keyOf(g) === cat.id && !g.archived);
        const items = all.filter(g => !q || (g.name + ' ' + (g.description || '') + ' ' + (g.source || '')).toLowerCase().includes(q));
        const mine = lines.filter(l => keyOf(gearById(l.gear_id)) === cat.id).sort((x, y) => gearById(x.gear_id).sort - gearById(y.gear_id).sort);
        if (cat.id === 'none' && !all.length && !mine.length) return '';
        if (q && !items.length && !mine.length) return '';
        const sub = mine.reduce((t, l) => t + money.sellCAD(gearById(l.gear_id), S, l.sell_cad) * l.qty, 0);
        const open = !!q || !openCats || openCats[cat.id] !== false;
        const left = items.length ? items.map(g => {
          const on = !!inPkg(c, g.id);
          return `<li class="gi ${on ? 'on' : ''}" data-gid="${g.id}" role="button" tabindex="0" aria-pressed="${on}">
            <span class="box" aria-hidden="true"></span>
            ${g.thumb ? `<img class="th" src="${esc(g.thumb)}" alt="" loading="lazy">` : '<span class="th none"></span>'}
            <span><span class="nm">${esc(g.name)}</span><br><span class="sub">${esc(g.source || '')}${g.volume_l ? ` · ${g.volume_est ? '≈' : ''}${g.volume_l} L` : ''}${g.capacity_l ? ` · holds ${g.capacity_l} L` : ''}</span></span>
            <span class="pr">${money.cad(money.sellCAD(g, S))}</span></li>`;
        }).join('') : `<li class="pk-none">${all.length ? 'No match.' : 'No gear in this capability yet. Add some in Master gear.'}</li>`;
        const right = mine.length ? mine.map(l => {
          const g = gearById(l.gear_id), unit = money.sellCAD(g, S, l.sell_cad);
          return `<li class="pi" data-lid="${l.id}">
            <span class="nm">${esc(g.name)}${g.archived ? ' <span class="sub">(archived)</span>' : ''}</span>
            <span class="qty"><button type="button" data-q="-1" aria-label="Fewer">−</button><input type="number" min="1" max="99" value="${l.qty}" aria-label="Quantity"><button type="button" data-q="1" aria-label="More">+</button></span>
            <input class="unit ${l.sell_cad != null ? 'custom' : ''}" type="number" step="0.01" min="0" placeholder="${money.sellCAD(g, S).toFixed(2)}" value="${l.sell_cad != null ? l.sell_cad : ''}" aria-label="Unit price for this client (CAD)" title="Client unit price, CAD">
            <span class="line">${money.cad(unit * l.qty)}</span>
            <button class="x" type="button" aria-label="Remove ${esc(g.name)}">×</button></li>`;
        }).join('') : '<li class="pk-none">Nothing yet</li>';
        return `<div class="band ${open ? '' : 'closed'} ${mine.length ? '' : 'none-in'}" data-cat="${cat.id}">
          <button type="button" class="h2 bh" data-toggle aria-expanded="${open}"><span class="t">${esc(cat.name)}</span><span class="sub">${mine.length} of ${all.length}</span></button>
          <div class="h2 bh right"><span class="t">${esc(cat.name)}</span><span class="sub">${mine.length ? money.cad(sub) : '—'}</span></div>
          <ul class="gl" data-cat="${cat.id}">${left}</ul>
          <ul class="pk" data-cat="${cat.id}">${right}</ul>
        </div>`;
      }).join('') || '<p class="tl-empty">No gear matches.</p>';
      host.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', () => {
        const band = b.closest('.band'); band.classList.toggle('closed');
        b.setAttribute('aria-expanded', !band.classList.contains('closed'));
        if (!catQuery) { openCats = openCats || {}; openCats[band.dataset.cat] = !band.classList.contains('closed'); }
      }));
      host.querySelectorAll('.gl').forEach(ul => Sortable.create(ul, {
        group: { name: 'gear', pull: 'clone', put: false }, sort: false, animation: 120,
        filter: '.on, .pk-none', preventOnFilter: false, delay: 80, delayOnTouchOnly: true,
      }));
      host.querySelectorAll('.pk').forEach(ul => Sortable.create(ul, {
        group: { name: 'gear', pull: false, put: true }, sort: false,
        onAdd(evt) { const gid = evt.item.dataset.gid; evt.item.remove(); if (gid && !inPkg(c, gid)) toggleGear(c, gid); },
      }));
    }
    document.addEventListener('click', e => {
      const li = e.target.closest('.gi'); if (!li) return;
      const c = customers.find(x => x.id === currentId); if (c) toggleGear(c, li.dataset.gid);
    });
    document.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('gi')) {
        e.preventDefault(); const c = customers.find(x => x.id === currentId); if (c) toggleGear(c, e.target.dataset.gid);
      }
    });

    let busy = false;
    async function toggleGear(c, gid) {
      if (busy) return; busy = true;
      try {
        const ex = inPkg(c, gid);
        if (ex) { await store.remove('customer_gear', ex.id); cg = cg.filter(x => x.id !== ex.id); }
        else { const r = await store.insert('customer_gear', { customer_id: c.id, gear_id: gid, qty: 1, sell_cad: null }); cg.push(r); }
        refreshGear(c, gid);
      } finally { busy = false; }
    }
    function refreshGear(c, focusGid) {
      const y = window.scrollY;
      renderCatalog(c); renderPackage(c); renderTotals(c); renderList();
      window.scrollTo(0, y);
      if (focusGid) { const el = document.querySelector(`.gi[data-gid="${focusGid}"]`); if (el && document.activeElement === document.body) el.focus({ preventScroll: true }); }
    }

    function renderPackage() { /* drawn inside renderCatalog bands */ }
    document.addEventListener('click', async e => {
      const pi = e.target.closest('.pi'); if (!pi) return;
      const l = cg.find(x => x.id === pi.dataset.lid); if (!l) return;
      const c = customers.find(x => x.id === currentId);
      if (e.target.closest('.x')) { await store.remove('customer_gear', l.id); cg = cg.filter(x => x.id !== l.id); refreshGear(c); return; }
      const qb = e.target.closest('[data-q]');
      if (qb) { const q = Math.max(1, Math.min(99, l.qty + Number(qb.dataset.q))); if (q !== l.qty) { l.qty = q; await store.update('customer_gear', l.id, { qty: q }); refreshGear(c); } }
    });
    document.addEventListener('change', async e => {
      const pi = e.target.closest('.pi'); if (!pi) return;
      const l = cg.find(x => x.id === pi.dataset.lid); if (!l) return;
      const c = customers.find(x => x.id === currentId);
      if (e.target.matches('.qty input')) { const q = Math.max(1, Math.min(99, parseInt(e.target.value) || 1)); l.qty = q; await store.update('customer_gear', l.id, { qty: q }); }
      if (e.target.matches('.unit')) { const v = e.target.value === '' ? null : Math.max(0, Number(e.target.value)); l.sell_cad = v; await store.update('customer_gear', l.id, { sell_cad: v }); }
      refreshGear(c);
    });

    /* ---------- training ---------- */
    function moduleHTML(m, i, assigned) {
      const links = (m.links || []).filter(x => x && x.url).map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label || 'Link')} ↗</a>`).join('');
      const body = `<span><span class="nm">${esc(m.title)}</span>${m.description ? `<div class="ds">${esc(m.description)}</div>` : ''}${links ? `<div class="lk">${links}</div>` : ''}</span>`;
      if (assigned) return `<li class="ti" data-mid="${m.id}"><span class="drag" title="Drag to reorder" aria-hidden="true">⋮⋮</span><span class="idx">${String(i + 1).padStart(2, '0')}</span>${body}<span><span class="dur">${m.duration_min ? m.duration_min + ' min' : ''}</span> <button class="x" type="button" data-unassign aria-label="Remove ${esc(m.title)}">×</button></span></li>`;
      return `<li class="ti" data-mid="${m.id}">${body}<button class="addm" type="button" data-assign aria-label="Add ${esc(m.title)}">+</button></li>`;
    }
    function renderTraining(c) {
      const path = document.getElementById('tpath'), lib = document.getElementById('tlib'); if (!path) return;
      const mine = cm.filter(x => x.customer_id === c.id).sort((a, b) => a.position - b.position);
      const mods = mine.map(x => modules.find(m => m.id === x.module_id)).filter(Boolean);
      const total = mods.reduce((s, m) => s + (m.duration_min || 0), 0);
      document.getElementById('tl-count').textContent = mods.length ? `${mods.length} modules${total ? ' · ' + (total / 60).toFixed(1) + ' h' : ''}` : '';
      path.innerHTML = mods.length ? mods.map((m, i) => moduleHTML(m, i, true)).join('') : '<li class="tl-empty">No modules yet. Add them from the library.</li>';
      const rest = modules.filter(m => !mine.some(x => x.module_id === m.id));
      lib.innerHTML = rest.length ? rest.map(m => moduleHTML(m, 0, false)).join('') : `<li class="tl-empty">${modules.length ? 'Every module is assigned.' : 'No modules in the library yet.'}</li>`;
      Sortable.create(path, {
        group: { name: 'train', put: true }, handle: '.drag', animation: 150, filter: '.tl-empty',
        onUpdate: () => saveOrder(c),
        onAdd: () => saveOrder(c),
      });
      Sortable.create(lib, { group: { name: 'train', pull: true, put: false }, sort: false, animation: 150, filter: '.tl-empty, .addm', preventOnFilter: false });
    }
    async function saveOrder(c) {
      const order = [...new Set([...document.getElementById('tpath').children].map(li => li.dataset.mid).filter(Boolean))];
      for (let i = 0; i < order.length; i++) {
        const mid = order[i];
        const ex = cm.find(x => x.customer_id === c.id && x.module_id === mid);
        if (ex) { if (ex.position !== i) { ex.position = i; await store.update('customer_modules', ex.id, { position: i }); } }
        else { const r = await store.insert('customer_modules', { customer_id: c.id, module_id: mid, position: i }); cm.push(r); }
      }
      renderTraining(c);
    }
    document.addEventListener('click', async e => {
      const c = customers.find(x => x.id === currentId); if (!c) return;
      const add = e.target.closest('[data-assign]');
      if (add) {
        const mid = add.closest('[data-mid]').dataset.mid;
        const pos = cm.filter(x => x.customer_id === c.id).length;
        const r = await store.insert('customer_modules', { customer_id: c.id, module_id: mid, position: pos }); cm.push(r);
        renderTraining(c); return;
      }
      const rm = e.target.closest('[data-unassign]');
      if (rm) {
        const mid = rm.closest('[data-mid]').dataset.mid;
        const ex = cm.find(x => x.customer_id === c.id && x.module_id === mid);
        if (ex) { await store.remove('customer_modules', ex.id); cm = cm.filter(x => x.id !== ex.id); }
        const rest = cm.filter(x => x.customer_id === c.id).sort((a, b) => a.position - b.position);
        for (let i = 0; i < rest.length; i++) if (rest[i].position !== i) { rest[i].position = i; await store.update('customer_modules', rest[i].id, { position: i }); }
        renderTraining(c);
      }
    });

    /* ---------- onboarding: household members ---------- */
    const MFIELDS = ['name', 'relationship', 'birth_year', 'sex', 'height', 'weight', 'size_top', 'size_bottom', 'size_shoe', 'size_other', 'blood_type', 'allergies', 'medical', 'medications', 'diet', 'mobility', 'notes'];
    function renderMembers(c) {
      const host = document.getElementById('members'); if (!host) return;
      const list = members.filter(m => m.customer_id === c.id).sort((a, b) => (a.sort || 0) - (b.sort || 0) || (a.birth_year || 0) - (b.birth_year || 0));
      const yr = new Date().getFullYear();
      host.innerHTML = list.length ? list.map(m => {
        const sizes = [m.size_top && 'Top ' + m.size_top, m.size_bottom && 'Pants ' + m.size_bottom, m.size_shoe && 'Shoe ' + m.size_shoe, m.size_other].filter(Boolean).join(' · ');
        const flags = [m.allergies && 'Allergies: ' + m.allergies, m.medical && 'Medical: ' + m.medical, m.medications && 'Meds: ' + m.medications, m.mobility && m.mobility, m.diet && 'Diet: ' + m.diet].filter(Boolean).join(' · ');
        return `<li data-mid="${m.id}" tabindex="0"><span class="nm">${esc(m.name)}${m.relationship ? ` <span class="muted" style="font-weight:400">· ${esc(m.relationship)}</span>` : ''}</span>
          <span class="age">${m.birth_year ? (yr - m.birth_year) + ' yrs' : ''}${m.sex ? ' · ' + esc(m.sex) : ''}</span>
          ${sizes ? `<span class="sub">${esc(sizes)}</span>` : ''}${flags ? `<span class="flag">${esc(flags)}</span>` : ''}</li>`;
      }).join('') : '<li class="empty">No one added yet. Start with the person you spoke to, then everyone in the household.</li>';
    }
    document.addEventListener('click', e => {
      const li = e.target.closest('.mem li[data-mid]'); if (!li) return;
      const c = customers.find(x => x.id === currentId); openMember(c, members.find(m => m.id === li.dataset.mid));
    });
    const mdlg = document.getElementById('mdlg'), mform = document.getElementById('mform');
    let editingM = null, memberFor = null;
    function openMember(c, m) {
      memberFor = c; editingM = m || null; mform.reset();
      document.getElementById('mdlg-title').textContent = m ? 'Edit person' : 'Add person';
      document.getElementById('mdelete').hidden = !m;
      if (m) for (const k of MFIELDS) mform.elements[k].value = m[k] != null ? m[k] : '';
      mdlg.showModal(); mform.elements.name.focus();
    }
    mdlg.addEventListener('close', async () => {
      if (mdlg.returnValue !== 'save') return;
      const d = {}; for (const k of MFIELDS) d[k] = mform.elements[k].value.trim() || null;
      d.birth_year = d.birth_year ? parseInt(d.birth_year) : null;
      if (!d.name) return;
      if (editingM) Object.assign(editingM, await store.update('members', editingM.id, d));
      else { d.customer_id = memberFor.id; d.sort = members.filter(m => m.customer_id === memberFor.id).length; members.push(await store.insert('members', d)); }
      toast('Saved'); renderWork();
    });
    document.getElementById('mdelete').addEventListener('click', async () => {
      if (!editingM || !confirm(`Remove ${editingM.name} from this household?`)) return;
      await store.remove('members', editingM.id); members = members.filter(m => m.id !== editingM.id);
      mdlg.close('cancel'); renderWork();
    });

    /* ---------- customer schedule ---------- */
    function renderTasks(c) {
      const host = document.getElementById('ctasks'); if (!host) return;
      const today = new Date().toISOString().slice(0, 10);
      const list = tasks.filter(t => t.customer_id === c.id).sort((a, b) => (!!a.done_at - !!b.done_at) || a.due_date.localeCompare(b.due_date));
      host.innerHTML = list.length ? list.map(t => `<li class="${t.done_at ? 'done' : (t.due_date < today ? 'late' : '')}" data-tid="${t.id}">
        <input type="checkbox" ${t.done_at ? 'checked' : ''} aria-label="Done"><span class="d">${RS.fmtDate(t.due_date)}</span>
        <span>${esc(t.kind)}${t.title ? ' — ' + esc(t.title) : ''}</span><span class="who">${esc(t.assignee || '')} <button type="button" class="x" data-del aria-label="Delete">×</button></span></li>`).join('')
        : '<li style="display:block;color:var(--ink-3)">Nothing scheduled.</li>';
    }
    document.addEventListener('change', async e => {
      const li = e.target.closest('#ctasks li[data-tid]'); if (!li || e.target.type !== 'checkbox') return;
      const t = tasks.find(x => x.id === li.dataset.tid);
      await RS.completeTask(t, e.target.checked, tasks);
      renderWork();
    });
    document.addEventListener('click', async e => {
      const b = e.target.closest('#ctasks [data-del]'); if (!b) return;
      const id = b.closest('li').dataset.tid; await store.remove('tasks', id); tasks = tasks.filter(t => t.id !== id); renderWork();
    });

    /* ---------- customer dialog ---------- */
    const dlg = document.getElementById('cdlg'), form = document.getElementById('cform');
    const CFIELDS = ['name', 'email', 'phone', 'household', 'location', 'status', 'referred_by', 'address', 'home', 'vehicles', 'pets', 'emergency_contacts', 'notes'];
    let editing = null;
    function openCustomer(c) {
      editing = c || null; form.reset();
      document.getElementById('cdlg-title').textContent = c ? 'Edit customer' : 'New customer';
      document.getElementById('cdelete').hidden = !c;
      form.elements.referred_by.innerHTML = '<option value="">No one</option>' + customers.filter(x => !c || x.id !== c.id).map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('');
      if (c) for (const k of CFIELDS) form.elements[k].value = c[k] || (k === 'status' ? 'Intake' : '');
      dlg.showModal(); form.elements.name.focus();
    }
    document.getElementById('new-customer').addEventListener('click', () => openCustomer(null));
    dlg.addEventListener('close', async () => {
      if (dlg.returnValue !== 'save') return;
      const data = {}; for (const k of CFIELDS) data[k] = form.elements[k].value.trim() || null;
      if (RS.live && customers.length && !('referred_by' in customers[0])) delete data.referred_by; // column not added yet
      data.status = data.status || 'Intake';
      if (!data.name) return;
      const where = data.address || data.location;
      const moved = !editing || where !== (editing.address || editing.location);
      let rec;
      if (editing) { rec = Object.assign(editing, await store.update('customers', editing.id, data)); toast('Saved'); }
      else { rec = await store.insert('customers', data); customers.push(rec); currentId = rec.id; toast('Customer added'); }
      customers.sort((a, b) => a.name.localeCompare(b.name));
      select(currentId);
      if (moved) { // place them on the map
        const pt = where ? await RS.geocode(where) : null;
        const patch = pt ? { lat: pt.lat, lng: pt.lng } : { lat: null, lng: null };
        try { Object.assign(rec, await store.update('customers', rec.id, patch)); } catch (e) {}
        if (where && !pt) toast('Saved, but that location could not be found on the map', true);
      }
    });
    document.getElementById('cdelete').addEventListener('click', async () => {
      if (!editing) return;
      const typed = prompt(`Type DELETE to remove ${editing.name} and their package.`);
      if (typed !== 'DELETE') return;
      await store.remove('customers', editing.id);
      customers = customers.filter(x => x.id !== editing.id);
      cg = cg.filter(x => x.customer_id !== editing.id); cm = cm.filter(x => x.customer_id !== editing.id);
      dlg.close('cancel'); select(null); toast('Customer deleted');
    });

    await load();
    if (currentId && !customers.some(c => c.id === currentId)) currentId = null;
    if (!currentId && customers.length && window.innerWidth >= 900) currentId = customers[0].id;
    select(currentId);
  })();
  </script>
</body>
</html>
