<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Sign In | Resilience Systems</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="admin.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
    .card { width: min(380px, 100%); border: 2px solid var(--ink); }
    .card-head { padding: 14px 20px; border-bottom: 1px solid var(--rule); }
    .card-head .t { font-weight: 600; letter-spacing: .02em; }
    .card-head small { display: block; color: var(--ink-3); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    form { padding: 16px 20px 20px; display: grid; gap: 12px; }
    .who { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .who label { border: 1px solid var(--rule-soft); padding: 8px; text-align: center; cursor: pointer; font-size: 13px; }
    .who input { position: absolute; opacity: 0; pointer-events: none; }
    .who label:has(input:checked) { border-color: var(--ink); background: var(--sel); font-weight: 600; }
    .err { color: #a3271b; font-size: 12px; min-height: 16px; margin: 0; }
    .note { font-size: 12px; color: var(--ink-3); margin: 0; }
    .btn-solid { padding: 8px 12px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="card-head"><div class="t">Resilience Systems · Admin</div><small>Restricted</small></div>

    <form id="demo-form" hidden>
      <span class="lbl">Sign in as</span>
      <div class="who" id="who"></div>
      <p class="note">Demo mode. Data lives in this browser only until the database is connected.</p>
      <p class="err" id="demo-err"></p>
      <button class="btn btn-solid" type="submit">Enter</button>
    </form>

    <form id="live-form" hidden>
      <label class="field"><span class="lbl">Email</span><input type="email" id="email" autocomplete="username" required></label>
      <label class="field"><span class="lbl">Password</span><input type="password" id="password" autocomplete="current-password"></label>
      <p class="err" id="live-err"></p>
      <button class="btn btn-solid" type="submit">Sign in</button>
      <div class="row"><span class="note">First time, or forgot it?</span><button type="button" class="adm-link" id="send-link">Email me a sign-in link</button></div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="core.js"></script>
  <script>
    (async function () {
      const { auth, live, esc } = RS;
      const u = await auth.current();
      if (u && !u.denied) { location.href = 'customers.html'; return; }
      if (!live) {
        const f = document.getElementById('demo-form'); f.hidden = false;
        document.getElementById('who').innerHTML = (RS_CONFIG.ADMINS || []).map((a, i) =>
          `<label><input type="radio" name="who" value="${esc(a.email)}" ${i === 0 ? 'checked' : ''}><span>${esc(a.name)}</span></label>`).join('');
        f.addEventListener('submit', async e => {
          e.preventDefault();
          const v = f.querySelector('input[name=who]:checked'); if (!v) return;
          await auth.signIn(v.value); location.href = 'customers.html';
        });
        return;
      }
      const f = document.getElementById('live-form'); f.hidden = false;
      const err = document.getElementById('live-err');
      if (new URLSearchParams(location.search).get('denied')) err.textContent = 'That account is not on the admin list.';
      f.addEventListener('submit', async e => {
        e.preventDefault(); err.textContent = '';
        const email = f.elements.email.value.trim(), pw = f.elements.password.value;
        if (!pw) { err.textContent = 'Enter your password, or use the sign-in link.'; return; }
        try { await auth.signIn(email, pw); location.href = 'customers.html'; }
        catch (x) { err.textContent = x.message || 'Sign in failed.'; }
      });
      document.getElementById('send-link').addEventListener('click', async () => {
        err.textContent = '';
        const email = f.elements.email.value.trim();
        if (!email) { err.textContent = 'Enter your email first.'; return; }
        try { await auth.sendLink(email); err.style.color = 'var(--ink-3)'; err.textContent = 'Check your inbox for the sign-in link.'; }
        catch (x) { err.style.color = ''; err.textContent = x.message; }
      });
    })();
  </script>
</body>
</html>
